# fly.toml - Fly.io configuration for WebRTC Signaling Server

app = "speed-share-signaling"
primary_region = "sjc"  # Change to your preferred region (sjc, iad, lhr, etc.)

[build]
  # Use Bun's official Docker image
  [build.args]
    BUN_VERSION = "1.1.38"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"  # Keep WebSocket connections alive
  auto_start_machines = true
  min_machines_running = 1    # Always keep at least 1 machine running

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/"
    protocol = "http"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# WebSocket support - crucial for your signaling server
[experimental]
  enable_consul = false
  
# Keep connections alive
[services]
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  # Health checks
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/"
    protocol = "http"